name: Convert Upstream CSV to JSON

on:
  workflow_dispatch: # Actionsタブから手動実行
  schedule:
    - cron: '0 0 * * *' # 毎日深夜0時に自動更新（必要に応じて変更可能）

jobs:
  convert-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 変換結果のコミット・プッシュに必要

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Convert CSV to JSON
        run: |
          python3 - << 'EOF'
          import csv
          import json
          import os
          import urllib.request

          # 参照元リポジトリのデータURL
          BASE_URL = "https://raw.githubusercontent.com/htvoffcial/htvoffcial_paper/main/data"
          LTEMPL_URL = f"{BASE_URL}/ltempl.csv"
          WORDS_URL = f"{BASE_URL}/words.csv"

          # 出力先ディレクトリの作成
          os.makedirs("data", exist_ok=True)

          # 1. ltempl.csv の処理 -> data/template.json
          print("Processing ltempl.csv...")
          with urllib.request.urlopen(LTEMPL_URL) as res:
              lines = [line.decode("utf-8") for line in res.readlines()]
              reader = csv.DictReader(lines)
              templates = [row for row in reader]

          with open("data/template.json", "w", encoding="utf-8") as f:
              json.dump(templates, f, ensure_ascii=False, indent=2)

          # 2. words.csv の処理 -> data/{pos}-words.json
          print("Processing words.csv...")
          with urllib.request.urlopen(WORDS_URL) as res:
              lines = [line.decode("utf-8") for line in res.readlines()]
              reader = csv.DictReader(lines)
              
              pos_dict = {}
              for row in reader:
                  pos = row["pos"].strip()
                  word = row["word"].strip()
                  if pos not in pos_dict:
                      pos_dict[pos] = []
                  pos_dict[pos].append(word)

          for pos, words in pos_dict.items():
              output_path = f"data/{pos}-words.json"
              print(f"Saving {output_path}...")
              with open(output_path, "w", encoding="utf-8") as f:
                  json.dump(words, f, ensure_ascii=False, indent=2)

          print("Conversion completed successfully!")
          EOF

      - name: Commit and Push generated JSON files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update JSON data from htvoffcial_paper" && git push)
