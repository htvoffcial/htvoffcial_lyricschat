name: Generate JSON from CSV

on:
  push:
    paths:
      - 'data/words.csv'
      - 'data/ltempl.csv'
  workflow_dispatch: # GitHubの画面から手動実行できるようにする

permissions:
  contents: write # コミットをプッシュするための権限

jobs:
  convert-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Convert CSV to JSON
        run: |
          python3 - << 'EOF'
          import csv
          import json
          import os
          from collections import defaultdict

          data_dir = 'data'
          if not os.path.exists(data_dir):
              os.makedirs(data_dir)

          # 1. words.csv を {pos}-words.json に変換
          words_path = os.path.join(data_dir, 'words.csv')
          if os.path.exists(words_path):
              pos_dict = defaultdict(list)
              with open(words_path, 'r', encoding='utf-8-sig') as f:
                  reader = csv.DictReader(f)
                  for row in reader:
                      pos = row.get('pos', '').strip()
                      word = row.get('word', '').strip()
                      if pos and word:
                          pos_dict[pos].append(word)
              
              # 品詞(pos)ごとにJSONファイルを生成
              for pos, words in pos_dict.items():
                  out_path = os.path.join(data_dir, f'{pos}-words.json')
                  with open(out_path, 'w', encoding='utf-8') as f:
                      # separators=(',', ':') で無駄な空白を省き、最小化(Minify)して出力
                      json.dump(words, f, ensure_ascii=False, separators=(',', ':'))

          # 2. ltempl.csv を template.json に変換
          ltempl_path = os.path.join(data_dir, 'ltempl.csv')
          if os.path.exists(ltempl_path):
              templ_dict = defaultdict(list)
              with open(ltempl_path, 'r', encoding='utf-8-sig') as f:
                  reader = csv.DictReader(f)
                  for row in reader:
                      t_type = row.get('type', '').strip()
                      template = row.get('template', '').strip()
                      if t_type and template:
                          templ_dict[t_type].append(template)
              
              out_path = os.path.join(data_dir, 'template.json')
              with open(out_path, 'w', encoding='utf-8') as f:
                  json.dump(templ_dict, f, ensure_ascii=False, separators=(',', ':'))
          EOF

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # JSONファイルをステージング
          git add data/*.json
          
          # 差分がある場合のみコミット＆プッシュを実行
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-generate JSON from CSV [skip ci]"
            git push
          else
            echo "No changes detected. Skipping commit."
          fi
