<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vectorized Chat UI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #131314;
            color: #e3e3e3;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
        }

        /* ----------------------------------
           左ペイン（サイドバー）
        ---------------------------------- */
        #sidebar {
            width: 260px;
            background-color: #1e1f20;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #2e2f31;
            flex-shrink: 0;
            height: 100%;
        }

        .sidebar-header {
            padding: 16px;
        }

        .new-chat-btn {
            width: 100%;
            padding: 10px 16px;
            background-color: #2b2c2e;
            color: #e3e3e3;
            border: 1px solid #444746;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background-color: #37393b;
        }

        .history-title {
            padding: 12px 16px 6px;
            font-size: 12px;
            color: #8e918f;
            font-weight: bold;
        }

        #history-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 8px;
        }

        .history-item {
            padding: 10px 12px;
            margin: 2px 0;
            border-radius: 8px;
            font-size: 14px;
            color: #c4c7c5;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.15s;
        }

        .history-item:hover {
            background-color: #2b2c2e;
        }

        .history-item.active {
            background-color: #004a77;
            color: #c2e7ff;
        }

        /* ----------------------------------
           右ペイン（メインチャット領域）
        ---------------------------------- */
        #main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            background-color: #131314;
            position: relative;
        }

        #chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid #2e2f31;
            font-size: 16px;
            font-weight: 600;
            color: #e3e3e3;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        #chat-log {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
            font-size: 15px;
        }

        .user-msg {
            align-self: flex-end;
            background: #2b2c2e;
            color: #e3e3e3;
            border-bottom-right-radius: 4px;
        }

        .bot-msg {
            align-self: flex-start;
            background: #1e1f20;
            color: #e3e3e3;
            border-bottom-left-radius: 4px;
            border: 1px solid #2e2f31;
        }

        .debug-info {
            font-size: 0.75em;
            color: #8e918f;
            margin-top: 6px;
            align-self: flex-start;
            margin-left: 4px;
        }

        /* 入力エリア */
        #input-container {
            padding: 16px 24px 24px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        #input-area {
            display: flex;
            align-items: center;
            background: #1e1f20;
            border: 1px solid #444746;
            border-radius: 28px;
            padding: 6px 8px 6px 20px;
            transition: border-color 0.2s;
        }

        #input-area:focus-within {
            border-color: #a8c7fa;
        }

        #user-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #e3e3e3;
            font-size: 15px;
            padding: 8px 0;
        }

        #user-input::placeholder {
            color: #8e918f;
        }

        #send-btn {
            background: #a8c7fa;
            color: #040e1e;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }

        #send-btn:hover {
            opacity: 0.85;
        }

        /* スロースクロールバー調整 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #444746;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
    </style>
</head>
<body>

<!-- 左ペイン: 操作・履歴 -->
<div id="sidebar">
    <div class="sidebar-header">
        <button class="new-chat-btn" id="new-chat-btn">
            <span>＋</span> 新しいチャット
        </button>
    </div>
    <div class="history-title">チャット履歴</div>
    <div id="history-list"></div>
</div>

<!-- 右ペイン: チャット画面 -->
<div id="main-container">
    <div id="chat-header">
        <span>Vectorized Bot (No LLM)</span>
    </div>
    <div id="chat-log"></div>
    <div id="input-container">
        <div id="input-area">
            <input type="text" id="user-input" placeholder="メッセージを入力 (例: 'tell me a lyric about data')" autocomplete="off" autofocus>
            <button id="send-btn">➤</button>
        </div>
    </div>
</div>

<script>
    // データベース
    const db = {
        templates: {},
        words: { N: [], V: [], A: [], ADV: [] },
        categoryVectors: {}
    };

    // セッション・履歴管理
    let chatSessions = [];
    let currentSessionId = null;

    // 初期化関数
    async function init() {
        // 初期チャット作成
        createNewChat(false);
        appendMessage('System', 'データベースを読み込んでいます...', 'bot-msg');
        
        try {
            const resT = await fetch('data/template.json');
            db.templates = await resT.json();
            
            for (const pos of ['N', 'V', 'A', 'ADV']) {
                const res = await fetch(`data/${pos}-words.json`);
                if (res.ok) db.words[pos] = await res.json();
            }
        } catch (e) {
            console.warn("Fetch failed, using mock data.", e);
            db.templates = {
                title: ["Echoes of {N}", "The {A} {N}", "{V}ing in the {N}"],
                lyric: ["In the core of the {A} {N},\nWe {ADV} {V} the {N}.", "Every {A} {N} will {V},\nAs the {N} {ADV} {V}s."],
                chat: ["I see you are talking about {N}.", "Let's {ADV} {V} the {A} {N}!"]
            };
            db.words.N = ["algorithm", "data", "system", "research", "hypothesis", "world", "song"];
            db.words.V = ["analyze", "investigate", "sing", "explore", "discover"];
            db.words.A = ["complex", "smart", "brilliant", "beautiful", "hidden"];
            db.words.ADV = ["quickly", "silently", "deeply", "carefully"];
        }

        buildVectors();
        document.getElementById('chat-log').innerHTML = ''; // クリア
        
        const welcomeMsg = 'Ready! 学習完了しました。入力からベクトルを計算して回答します。';
        appendMessage('Bot', welcomeMsg, 'bot-msg');
        saveCurrentSessionMessage('Bot', welcomeMsg, 'bot-msg');
    }

    // --- チャットセッション管理 ---
    function createNewChat(switchSession = true) {
        const sessionId = Date.now();
        const newSession = {
            id: sessionId,
            title: '新しいチャット',
            messages: []
        };
        chatSessions.unshift(newSession);
        
        if (switchSession) {
            switchChatSession(sessionId);
            document.getElementById('chat-log').innerHTML = '';
            appendMessage('Bot', 'Ready! 新しいチャットを開始しました。', 'bot-msg');
            saveCurrentSessionMessage('Bot', 'Ready! 新しいチャットを開始しました。', 'bot-msg');
        } else {
            currentSessionId = sessionId;
        }
        renderHistoryList();
    }

    function switchChatSession(sessionId) {
        currentSessionId = sessionId;
        const session = chatSessions.find(s => s.id === sessionId);
        const chatLog = document.getElementById('chat-log');
        chatLog.innerHTML = '';
        
        if (session && session.messages) {
            session.messages.forEach(m => {
                appendMessage(m.sender, m.text, m.className, m.debugInfo, false);
            });
        }
        renderHistoryList();
    }

    function saveCurrentSessionMessage(sender, text, className, debugInfo = "") {
        const session = chatSessions.find(s => s.id === currentSessionId);
        if (!session) return;

        // 最初のユーザー発言をセッションタイトルにする
        if (sender === 'You' && session.title === '新しいチャット') {
            session.title = text.length > 15 ? text.substring(0, 15) + '...' : text;
            renderHistoryList();
        }

        session.messages.push({ sender, text, className, debugInfo });
    }

    function renderHistoryList() {
        const listContainer = document.getElementById('history-list');
        listContainer.innerHTML = '';

        chatSessions.forEach(session => {
            const item = document.createElement('div');
            item.className = `history-item ${session.id === currentSessionId ? 'active' : ''}`;
            item.textContent = session.title;
            item.onclick = () => switchChatSession(session.id);
            listContainer.appendChild(item);
        });
    }

    // --- ベクトル・分析ロジック ---
    function tokenize(text) {
        return text.toLowerCase().replace(/[^\w\s]/g, '').split(/\s+/).filter(w => w.length > 0);
    }

    function buildVectors() {
        for (const [category, texts] of Object.entries(db.templates)) {
            const vector = {};
            texts.forEach(text => {
                const cleanText = text.replace(/\{[A-Z]+\}/g, '');
                const tokens = tokenize(cleanText);
                tokens.push(category); 
                tokens.push(category); 
                
                tokens.forEach(token => {
                    vector[token] = (vector[token] || 0) + 1;
                });
            });
            db.categoryVectors[category] = vector;
        }
    }

    function calculateDotProduct(vec1, vec2) {
        let score = 0;
        for (const word in vec1) {
            if (vec2[word]) score += vec1[word] * vec2[word];
        }
        return score;
    }

    function generateResponse(userInput) {
        const userTokens = tokenize(userInput);
        const userVector = {};
        userTokens.forEach(t => userVector[t] = (userVector[t] || 0) + 1);

        let bestCategory = null;
        let maxScore = -1;
        
        for (const [category, catVector] of Object.entries(db.categoryVectors)) {
            const score = calculateDotProduct(userVector, catVector);
            if (score > maxScore) {
                maxScore = score;
                bestCategory = category;
            }
        }

        if (maxScore === 0 || !bestCategory) {
            const categories = Object.keys(db.templates);
            bestCategory = categories[Math.floor(Math.random() * categories.length)];
        }

        const userParams = { N: [], V: [], A: [], ADV: [] };
        userTokens.forEach(token => {
            for (const pos in db.words) {
                if (db.words[pos].includes(token)) {
                    userParams[pos].push(token);
                }
            }
        });

        const categoryTemplates = db.templates[bestCategory];
        const selectedTemplate = categoryTemplates[Math.floor(Math.random() * categoryTemplates.length)];

        const responseText = selectedTemplate.replace(/\{([A-Z]+)\}/g, (match, pos) => {
            if (userParams[pos] && userParams[pos].length > 0 && Math.random() > 0.4) {
                return userParams[pos][Math.floor(Math.random() * userParams[pos].length)];
            }
            const words = db.words[pos];
            if (words && words.length > 0) {
                return words[Math.floor(Math.random() * words.length)];
            }
            return match; 
        });

        return {
            text: responseText,
            category: bestCategory,
            score: maxScore
        };
    }

    // --- UI描画処理 ---
    const chatLog = document.getElementById('chat-log');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const newChatBtn = document.getElementById('new-chat-btn');

    function appendMessage(sender, text, className, debugInfo = "", save = true) {
        const wrapper = document.createElement('div');
        wrapper.className = 'message-wrapper';
        
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        msgDiv.textContent = text;
        
        wrapper.appendChild(msgDiv);
        
        if (debugInfo) {
            const debugDiv = document.createElement('div');
            debugDiv.className = 'debug-info';
            debugDiv.textContent = debugInfo;
            wrapper.appendChild(debugDiv);
        }

        chatLog.appendChild(wrapper);
        chatLog.scrollTop = chatLog.scrollHeight;

        if (save) {
            saveCurrentSessionMessage(sender, text, className, debugInfo);
        }
    }

    function handleSend() {
        const text = userInput.value.trim();
        if (!text) return;
        
        appendMessage('You', text, 'user-msg');
        userInput.value = '';

        setTimeout(() => {
            const res = generateResponse(text);
            const debugText = `[Intent: ${res.category} | Vector Score: ${res.score}]`;
            appendMessage('Bot', res.text, 'bot-msg', debugText);
        }, 400);
    }

    sendBtn.addEventListener('click', handleSend);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleSend();
    });
    newChatBtn.addEventListener('click', () => createNewChat(true));

    // 起動
    init();
</script>
</body>
</html>
